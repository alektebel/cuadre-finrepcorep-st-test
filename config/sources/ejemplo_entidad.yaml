# Plantilla para una entidad real. Copiar, renombrar y rellenar.
fuentes:
  - marco: ST
    loader: excel_annex            # plantillas ST 2025 de la EBA (verificar layout al tenerlas)
    fichero: data/entidad/st2025_templates.xlsx
    escala: 1000000                # VERIFICAR en la Template Guidance la unidad exigida
    decimales: 2
  - marco: FINREP
    loader: excel_annex            # export con layout de anexo EBA
    fichero: data/entidad/finrep.xlsx
    escala: 1
    decimales: 2
