# estado: pendiente | descargado | no_encontrado
fuentes:
  - id: EBA-GL-2018-04
    titulo: Guidelines on institutions' stress testing
    referencia: EBA/GL/2018/04 (19/07/2018, aplican desde 01/01/2019)
    indicado_por: usuario (2026-11-03)
    carpeta: eba_gl
    url: "https://www.eba.europa.eu/sites/default/documents/files/documents/10180/2282644/2b604bc8-fd08-4b17-ac4a-cdd5e662b802/Guidelines%20on%20institutions%20stress%20testing%20%28EBA-GL-2018-04%29.pdf"
    url_alternativas:
      - "https://www.bankofengland.co.uk/-/media/boe/files/paper/2020/december/gl-institutions-stress-testing.pdf"
    pagina: "https://www.eba.europa.eu/guidelines-stress-testing"
    nota: >
      Directrices sobre el programa de stress testing INTERNO de las entidades (gobierno,
      infraestructura de datos, áreas de riesgo, integración en el SREP). No es material del
      EU-wide stress test ni, por lo que se sabe hasta ahora, contiene cuadres a nivel de celda
      con FINREP/COREP. Pendiente de confirmar al leer el PDF.
    estado: pendiente

